name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # pour publier l'APK dans une release lors d'un tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests du lecteur ZIP
        run: python3 test/run_tests.py

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.PLANCHE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > planche.keystore
            echo "Clé personnelle utilisée."
          else
            echo "::warning::Secret PLANCHE_KEYSTORE_B64 absent : APK signé avec une clé jetable, il ne s'installera pas par-dessus une version signée avec ta clé."
          fi

      - name: Compilation
        run: ./build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Planche-apk
          path: build/Planche.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Planche.apk --title "Planche $GITHUB_REF_NAME" --generate-notes
